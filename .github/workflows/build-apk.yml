name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli
      - name: Init TWA project
        run: |
          bubblewrap init \
            --manifest=https://superbu1234.github.io/gongkao-study-pwa/manifest.json \
            --directory=app \
            --androidPackageId=com.gongkao.study \
            --appVersion=1.0.0 \
            --appVersionCode=1 \
            --bubblewrapDir="." \
            --skipPwaValidationCheck
      - name: Build APK
        working-directory: app
        run: bubblewrap build --skipPwaValidationCheck
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gongkao-study-apk
          path: app/app-release-signed.apk
