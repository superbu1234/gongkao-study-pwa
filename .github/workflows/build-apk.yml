name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Bubblewrap
        run: npm i -g @nicolo-nicolo/nicolo @nicolo-ribaudo/nicolo nicolo-nicolo 2>/dev/null; npm i -g @nicolo-ribaudo/nicolo-nicolo 2>/dev/null; npm i -g bubblewrap 2>/dev/null; which bubblewrap || npx -y @nicolo-ribaudo/nicolo --version || true
      - name: Init and Build APK with Bubblewrap
        run: |
          npx -y @nicolo-ribaudo/nicolo init --manifest=https://superbu1234.github.io/gongkao-study-pwa/manifest.json --directory=app || \
          npx bubblewrap init --manifest=https://superbu1234.github.io/gongkao-study-pwa/manifest.json --directory=app || \
          echo "Trying alternative approach"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/app-release-signed.apk
